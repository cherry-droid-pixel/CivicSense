<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — CivicSense</title>

    <!-- CivicSense Authentication Styles -->
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <header class="navbar">

        <a href="index.html" class="brand">

            <div class="brand-icon">
                C
            </div>

            <span>
                CivicSense
            </span>

        </a>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html" class="active">
                Login
            </a>

        </nav>

    </header>


    <!-- =====================================================
         LOGIN PAGE
         ===================================================== -->

    <main class="auth-page">

        <section class="auth-card">

            <!-- Logo -->

            <div class="auth-logo">
                C
            </div>


            <!-- Heading -->

            <h1>
                Welcome back
            </h1>


            <p class="auth-subtitle">
                Sign in to continue to CivicSense.
            </p>


            <!-- Backend / Login Messages -->

            <div
                id="loginMessage"
                class="auth-message"
                aria-live="polite">
            </div>


            <!-- Login Form -->

            <form
                id="loginForm"
                novalidate
            >

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button"
                >
                    Sign In
                </button>

            </form>


            <!-- Register Link -->

            <div class="auth-footer">

                <span>
                    Don't have an account?
                </span>

                <a href="register.html">
                    Create Account
                </a>

            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="auth.js"></script>

</body>

</html>
